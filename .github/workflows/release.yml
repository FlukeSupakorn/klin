name: Release

on:
  # push:
  #   tags:
  #     - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  build-worker:
    name: Build Worker (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            worker-binary: worker
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            worker-binary: worker.exe
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      # Build the FastAPI worker as a standalone binary
      # The binary will be bundled as a Tauri sidecar
      - name: Build worker binary
        shell: bash
        run: |
          uv run pyinstaller \
            --onefile \
            --name worker \
            --distpath dist \
            --specpath build \
            --clean \
            app/main.py

      - name: Upload worker binary
        uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.target }}
          path: worker/dist/${{ matrix.worker-binary }}
          retention-days: 1

  build-tauri:
    name: Build Tauri (${{ matrix.platform }})
    needs: [build-worker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            worker-binary: worker
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            worker-binary: worker.exe
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Create binaries directory for sidecar
      - name: Create binaries directory
        run: mkdir -p src-tauri/binaries

      - name: Download worker binary
        uses: actions/download-artifact@v4
        with:
          name: worker-${{ matrix.target }}
          path: src-tauri/binaries/

      - name: Make worker executable (Unix)
        if: matrix.platform != 'windows-latest'
        run: chmod +x src-tauri/binaries/${{ matrix.worker-binary }}

      # Tauri sidecar requires binaries to be named with the target triple
      # Format: <binary-name>-<target-triple>[.exe]
      - name: Rename worker binary for sidecar
        shell: bash
        run: |
          cd src-tauri/binaries
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            mv worker.exe worker-${{ matrix.target }}.exe
          else
            mv worker worker-${{ matrix.target }}
          fi
          ls -la

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Klin ${{ github.ref_name }}"
          releaseBody: |
            ## What's Changed

            See the assets below to download and install this version.

            ### Installation
            - **Windows**: Download and run the `.msi` or `.exe` installer
            - **macOS**: Download the `.dmg` file and drag to Applications
          releaseDraft: ${{ inputs.draft || true }}
          prerelease: false
          args: --target ${{ matrix.target }}

  cleanup:
    name: Cleanup Artifacts
    runs-on: ubuntu-latest
    needs: [build-tauri]
    if: always()
    steps:
      - name: Delete worker artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: worker-*
