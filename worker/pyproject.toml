[project]
name = "worker"
version = "0.2.0"
description = "FastAPI worker for multimodal document processing with RAG-Anything."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi-voyager>=0.12.3",
    "fastapi[standard]>=0.121.0",
    "httpx>=0.28.1",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pydantic-settings>=2.11.0",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.24",
    "aiosqlite>=0.21.0",
    "alembic>=1.14.0",
    "raganything[all]>=1.2.9",
    "lightrag-hku>=1.3.6",
    "ollama>=0.5.0",
]
