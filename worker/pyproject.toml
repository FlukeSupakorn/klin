[project]
name = "worker"
version = "0.1.0"
description = "FastAPI worker for document processing and vector storage."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi-voyager>=0.12.3",
    "fastapi[standard]>=0.121.0",
    "httpx>=0.28.1",
    "lancedb>=0.25.3",
    "langchain-ollama>=1.0.0",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "pydantic-settings>=2.11.0",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.24",
    "aiosqlite>=0.21.0",
    "alembic>=1.14.0",
]
